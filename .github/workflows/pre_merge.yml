name: pre_merge
on:
  pull_request_target:
    branches:
      - qcom-next-staging


jobs:
  check-dependencies:
    runs-on: self-hosted
    steps:
      - name: Get PR description
        id: get_pr
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q ".body")
          echo "PR_BODY=$PR_BODY" >> $GITHUB_ENV

      - name: Check for dependency
        run: |
          echo "$PR_BODY" | grep -i "depends on"


